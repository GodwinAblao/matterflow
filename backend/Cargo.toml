[package]
name = "matterflow-api"
version = "0.1.0"
edition = "2024"
default-run = "matterflow-api"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
